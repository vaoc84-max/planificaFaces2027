<script>
/* Motor de cálculo — Planificación 2027 FACES
   Pronóstico oct-dic 2026 por agencia, plan 2027 (Anexo 5 MPOL v4.2) y distribución a asesores.
   Funciones puras: sin DOM ni red. */
const ENGINE = (() => {
  const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const FLOWS = ['otm','otn','cuo','prr','prt','cam','orm','orn','sum','sun','dem','demn','prrn','prtn','can'];
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const nz = x => (isFinite(x) ? x : 0);

  /* Reparto entero exacto (resto mayor). total entero >= 0, pesos >= 0. */
  function lr(total, w) {
    total = Math.round(total);
    const n = w.length, W = sum(w);
    if (!n) return [];
    const ww = W > 0 ? w : w.map(() => 1), WW = W > 0 ? W : n;
    const raw = ww.map(x => total * x / WW);
    const out = raw.map(Math.floor);
    let rest = total - sum(out);
    const idx = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (let k = 0; k < idx.length && rest > 0; k++, rest--) out[idx[k][1]]++;
    for (let k = idx.length - 1; rest < 0 && k >= 0; k--) { if (out[idx[k][1]] > 0) { out[idx[k][1]]--; rest++; } }
    return out;
  }
  /* Reparto monetario exacto al centavo. */
  function cents(total, w) {
    const c = Math.round(total * 100);
    const sign = c < 0 ? -1 : 1;
    return lr(Math.abs(c), w).map(x => sign * x / 100);
  }

  /* Créditos de la agencia por mes: total anual = créditos por día × días-asesor efectivos; cada mes según la
     estacionalidad histórica (w) ajustada por la disponibilidad del mes (días-asesor efectivos / días-asesor nominales).
     Si piso > 0, ningún mes queda bajo piso × días-asesor del mes (se resuelve con un factor común sobre el resto). */
  function creditosMes(cpd, D, Dnom, w, piso) {
    const A = Math.round(cpd * sum(D));
    const t = w.map((x, m) => x * (Dnom[m] > 0 ? D[m] / Dnom[m] : 0));
    const T = sum(t) || 1;
    const s = t.map(x => A * x / T);
    if (!(piso > 0) || A < Math.round(piso * sum(D))) return lr(A, s);
    const f = D.map(d => piso * d);
    const tot = l => sum(s.map((x, m) => Math.max(f[m], l * x)));
    let lo = 0, hi = 1;
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (tot(mid) < A) lo = mid; else hi = mid; }
    return lr(A, s.map((x, m) => Math.max(f[m], hi * x)));
  }
  /* Reparto de créditos con mínimos por asesor: primero el mínimo y el resto por pesos. */
  function reparto(total, w, mins) {
    if (!mins || !mins.length) return lr(total, w);
    const sm = sum(mins);
    if (total < sm) return lr(total, w);
    const r = lr(total - sm, w);
    return r.map((v, i) => v + (mins[i] || 0));
  }
  /* Días hábiles (lun-vie sin feriados). fechas ISO 'YYYY-MM-DD'. */
  const iso = d => d.toISOString().slice(0, 10);
  function bizDaysIn(y, m, hol, from, to) { // m 1..12; from/to ISO opcionales para recorte
    const H = new Set(hol || []);
    let n = 0;
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    for (let d = 1; d <= last; d++) {
      const dt = new Date(Date.UTC(y, m - 1, d));
      const wd = dt.getUTCDay();
      if (wd === 0 || wd === 6) continue;
      const s = iso(dt);
      if (H.has(s)) continue;
      if (from && s < from) continue;
      if (to && s > to) continue;
      n++;
    }
    return n;
  }

  /* --------- Normalización del histórico de una agencia --------- */
  // h = {y:{'2025':{key:[13], _m}, '2026':{...}}}, invalid26: true si el archivo 2026 no es confiable
  function serie(h, year) {
    const y = h && h.y && h.y[year];
    return y && !y._invalid ? y : null;
  }

  /* Agregado FACES por año (suma de agencias con dato válido) para estacionalidad. */
  function aggregate(histList, year) {
    const out = {}; let m = 12;
    histList.forEach(h => {
      const y = serie(h, year); if (!y) return;
      m = Math.min(m, y._m);
      Object.keys(y).forEach(k => {
        if (k[0] === '_') return;
        out[k] = out[k] || Array(13).fill(0);
        y[k].forEach((v, i) => out[k][i] += +v || 0);
      });
    });
    out._m = m;
    return Object.keys(out).length > 1 ? out : null;
  }

  /* Factor estacional mes m (1..12) de un flujo: valor mes / promedio meses 1..base. */
  function factorFlujo(y, key, m, base) {
    if (!y || !y[key]) return null;
    const mean = sum(y[key].slice(1, base + 1)) / base;
    if (!(mean > 0)) return null;
    return y[key][m] / mean;
  }
  /* Factor estacional de una tasa sobre saldo previo. */
  function factorTasa(y, keys, m, base) {
    if (!y) return null;
    const rate = i => { const s = y.saldo[i - 1]; return s > 0 ? sum(keys.map(k => y[k][i])) / s : 0; };
    let acc = 0; for (let i = 1; i <= base; i++) acc += rate(i);
    const mean = acc / base;
    return mean > 0 ? rate(m) / mean : null;
  }
  /* Factor de trayectoria de un ratio de stock: ratio mes m / ratio mes base. */
  function factorRatio(y, key, den, m, base) {
    if (!y || !y[key] || !y[den]) return null;
    const r = i => (y[den][i] > 0 ? y[key][i] / y[den][i] : 0);
    return r(base) > 0 ? r(m) / r(base) : null;
  }
  const mezcla = (fa, ff, lo, hi) => {
    let f = fa == null ? ff : ff == null ? fa : 0.5 * fa + 0.5 * ff;
    if (f == null || !isFinite(f)) f = 1;
    return clamp(f, lo, hi);
  };

  /* --------- 1. PRONÓSTICO 2026 --------- */
  /* opts: {faces25, partial:{cm,cn}, octElapsed, octTotal}
     Devuelve {s:{key:[13]}, tipo:['R'|'P' x13], last, base:'2026'|'2025', notas:[]} */
  function forecast2026(h, opts) {
    const o = opts || {};
    const y25 = serie(h, '2025'), y26raw = serie(h, '2026');
    const notas = [];
    let last, ref, refBase;
    const s = {};
    const keys = ['saldo','otm','cuo','prr','prt','cam','vgn','otn','prrn','prtn','can','orm','orn','sum','sun','c1','c15','c30','c1n','c15n','c30n','prov','dem','demn'];
    if (y26raw && y26raw._m >= 1) {
      last = y26raw._m; ref = y26raw; refBase = last;
      keys.forEach(k => s[k] = (y26raw[k] || Array(13).fill(0)).slice());
    } else if (y25) {
      last = 0; ref = y25; refBase = y25._m;
      keys.forEach(k => { s[k] = Array(13).fill(0); s[k][0] = (y25[k] || [])[12] || 0; });
      notas.push('Sin dato 2026 válido: el pronóstico usa los promedios de 2025.');
    } else return null;
    const tipo = s.saldo.map((_, i) => (i === 0 || i <= last ? 'R' : 'P'));
    const F25 = o.faces25;

    // promedios y tasas de referencia: solo meses con operación normal (saldo previo > 0 y sin traspasos de cartera)
    const A = [];
    for (let i = 1; i <= refBase; i++) if (ref.saldo[i - 1] > 0 && ref.cuo[i] >= 0 && ref.prr[i] >= 0 && ref.prt[i] >= 0) A.push(i);
    if (A.length < refBase) notas.push(`Referencia: ${A.length} meses con operación normal (se excluyen apertura o traspasos de cartera).`);
    const sumR = k => sum(A.map(i => ref[k][i]));
    const mean = k => (A.length ? sumR(k) / A.length : 0);
    const prevSaldo = sum(A.map(i => ref.saldo[i - 1]));
    const prevVig = sum(A.map(i => ref.vgn[i - 1]));
    const recKeys = ['cuo', 'prr', 'prt'];
    const recRate = sum(recKeys.map(sumR)) / prevSaldo;
    const recShare = recKeys.map(k => sumR(k) / Math.max(1e-9, sum(recKeys.map(sumR))));
    const camRate = sumR('cam') / prevSaldo;
    let closures = 0;
    A.forEach(i => { closures += ref.vgn[i - 1] + ref.otn[i] - ref.can[i] - ref.vgn[i]; });
    const closeRate = closures / prevVig;
    const canRate = sumR('can') / prevVig;
    const prrnRate = sumR('prrn') / prevVig, prtnRate = sumR('prtn') / prevVig;
    const pOrigN = sumR('orn') / Math.max(1, sumR('otn'));
    const pOrigM = sumR('orm') / Math.max(1, sumR('otm'));
    const demMean = mean('dem'), demnMean = mean('demn');
    const baseRatio = (k, den) => (ref[den][refBase] > 0 ? ref[k][refBase] / ref[den][refBase] : 0);

    for (let m = last + 1; m <= 12; m++) {
      const fO = mezcla(factorFlujo(y25, 'otm', m, Math.min(9, y25 ? y25._m : 9)), factorFlujo(F25, 'otm', m, 9), 0.6, 1.6);
      const fN = mezcla(factorFlujo(y25, 'otn', m, Math.min(9, y25 ? y25._m : 9)), factorFlujo(F25, 'otn', m, 9), 0.6, 1.6);
      let otm = mean('otm') * fO, otn = mean('otn') * fN;
      if (o.partial && m === o.partialMonth && last === m - 1 && o.octTotal > 0) {
        const rem = Math.max(0, o.octTotal - o.octElapsed) / o.octTotal;
        otm = o.partial.cm + otm * rem;
        otn = o.partial.cn + otn * rem;
        notas.push(`${MESES[m - 1]} combina lo colocado al corte de Tipo de Cartera (${o.octElapsed} de ${o.octTotal} días hábiles) más el ritmo histórico de los días restantes.`);
      }
      otn = Math.round(otn); otm = r2(otm);
      const fR = mezcla(factorTasa(y25, recKeys, m, 9), factorTasa(F25, recKeys, m, 9), 0.7, 1.4);
      const S0 = s.saldo[m - 1], V0 = s.vgn[m - 1];
      const rec = S0 * recRate * fR;
      const parts = cents(r2(rec), recShare);
      s.cuo[m] = parts[0]; s.prr[m] = parts[1]; s.prt[m] = parts[2];
      s.cam[m] = r2(S0 * camRate);
      s.otm[m] = otm; s.otn[m] = otn;
      s.orn[m] = Math.round(otn * pOrigN); s.sun[m] = otn - s.orn[m];
      s.orm[m] = r2(otm * pOrigM); s.sum[m] = r2(otm - s.orm[m]);
      s.saldo[m] = r2(S0 + otm - s.cuo[m] - s.prr[m] - s.prt[m] - s.cam[m]);
      s.can[m] = Math.round(V0 * canRate);
      s.prrn[m] = Math.round(V0 * prrnRate); s.prtn[m] = Math.round(V0 * prtnRate);
      s.vgn[m] = Math.round(V0 + otn - s.can[m] - V0 * closeRate);
      [['c1', 'saldo'], ['c15', 'saldo'], ['c30', 'saldo'], ['prov', 'saldo']].forEach(([k, den]) => {
        const f = mezcla(factorRatio(y25, k, den, m, 9), factorRatio(F25, k, den, m, 9), 0.7, 1.3);
        s[k][m] = r2(s.saldo[m] * baseRatio(k, den) * f);
      });
      [['c1n', 'vgn'], ['c15n', 'vgn'], ['c30n', 'vgn']].forEach(([k, den]) => {
        const f = mezcla(factorRatio(y25, k, den, m, 9), factorRatio(F25, k, den, m, 9), 0.7, 1.3);
        s[k][m] = Math.round(s.vgn[m] * baseRatio(k, den) * f);
      });
      s.dem[m] = r2(demMean); s.demn[m] = Math.round(demnMean);
    }
    return { s, tipo, last, notas };
  }

  /* --------- 2. PARÁMETROS POR DEFECTO DEL PLAN --------- */
  function defaultsDesde(F, nAses) {
    const s = F.s;
    const A = []; for (let i = 1; i <= 12; i++) if (s.saldo[i - 1] > 0 && s.cuo[i] >= 0 && s.prr[i] >= 0 && s.prt[i] >= 0) A.push(i);
    const S = k => sum(A.map(i => s[k][i]));
    const prev = k => sum(A.map(i => s[k][i - 1]));
    const rec = (S('cuo') + S('prr') + S('prt')) / prev('saldo');
    const otn = S('otn'), otm = S('otm');
    let clos = 0; A.forEach(i => { clos += s.vgn[i - 1] + s.otn[i] - s.can[i] - s.vgn[i]; });
    const orn = S('orn'), orm = S('orm');
    const prom = otn > 0 ? otm / otn : 0;
    return {
      crec: 0,                                        // % crecimiento nº créditos vs 2026
      prom: Math.round(prom),                         // monto promedio 2027
      pOrig: otn > 0 ? +(orn / otn).toFixed(4) : 0,   // % originales (número)
      kOrig: orn > 0 && prom > 0 ? +((orm / orn) / prom).toFixed(4) : 1, // monto original / promedio
      recRate: +rec.toFixed(5),                       // recuperación mensual sobre saldo previo
      castRate: +(S('cam') / prev('saldo')).toFixed(6),
      castnRate: +(S('can') / prev('vgn')).toFixed(6),
      closeRate: +(clos / prev('vgn')).toFixed(5),
      demRate: +(S('dem') / prev('saldo')).toFixed(6),
      demnRate: +(S('demn') / prev('vgn')).toFixed(6),
      redC1: 0.024, redC15: 0.022, redC30: 0.008,     // reducción mensual de CER (formato institucional)
      montoMin: 300, montoMax: 20000,
      recDemRate: 0.0012, recCastRate: 0.0009,
      promoAsesor: 25, fAsesoria: 0.85, fPlanif: 1.18, fSolic: 1.15, fComite: 1,
      nAsesores: nAses || 0,
    };
  }

  /* Pesos estacionales de colocación 2027 (12 meses, suman 1): 2025 agencia + FACES. */
  function pesosMes(y25, F25) {
    const share = y => {
      if (!y || y._m < 12) return null;
      const t = sum(y.otn.slice(1)); return t > 0 ? y.otn.slice(1).map(v => v / t) : null;
    };
    const a = share(y25), f = share(F25);
    const w = Array.from({ length: 12 }, (_, i) => (a && f ? 0.5 * a[i] + 0.5 * f[i] : (a || f || [])[i] || 1 / 12));
    const t = sum(w); return w.map(v => v / t);
  }

  /* Perfil estacional de la recuperación 2027 (12 factores, promedio 1): tasa mensual 2025 / tasa media 2025, mitad agencia y mitad FACES. */
  function pesosRec(y25, F25) {
    const perfil = y => {
      if (!y || y._m < 12) return null;
      const r = []; for (let i = 1; i <= 12; i++) { const sp = y.saldo[i - 1]; r.push(sp > 0 ? (y.cuo[i] + y.prr[i] + y.prt[i]) / sp : null); }
      if (r.some(v => v == null || v < 0)) return null;
      const m = sum(r) / 12; return m > 0 ? r.map(v => v / m) : null;
    };
    const a = perfil(y25), f = perfil(F25);
    let w = Array.from({ length: 12 }, (_, i) => clamp(a && f ? 0.5 * a[i] + 0.5 * f[i] : (a || f || [])[i] || 1, 0.7, 1.4));
    const m = sum(w) / 12; return w.map(v => v / m);
  }

  /* --------- 3. PLAN 2027 DE AGENCIA (Anexo 5) --------- */
  /* F: pronóstico 2026; p: parámetros (defaults ⊕ overrides); w: pesos mensuales; mix: {EXC,INA,RET,LIQ,COV} participación del subsecuente */
  /* otnMes / promMes: arreglos de 12 con valores manuales por mes (null = automático). sRec: perfil estacional de recuperación. */
  function plan2027(F, p, w, mix, otnMes, promMes, sRec) {
    const s = F.s;
    const S0 = s.saldo[12], V0 = s.vgn[12];
    const otn26 = sum(s.otn.slice(1));
    const anual = Math.max(0, Math.round(otn26 * (1 + (+p.crec || 0))));
    const man = (arr, i) => Array.isArray(arr) && arr[i] !== null && arr[i] !== undefined && arr[i] !== '' && isFinite(arr[i]);
    const pa0 = p.promAses;
    const otnBase = Array.isArray(p.otnAuto) && p.otnAuto.length === 12 ? p.otnAuto : lr(anual, w);
    const otn = otnBase.map((v, i) => {
      if (man(otnMes, i)) return Math.max(0, Math.round(+otnMes[i]));
      const piso = pa0 && pa0.min ? sum(pa0.min[i]) : 0;
      return Math.max(v, piso);
    });
    const promBase = p.prom * (1 + (+p.promVar || 0));
    /* Con montos por asesor (p.promAses = {W, prom}) el promedio del mes sale de los créditos que recibe cada asesor × su monto. */
    const pa = p.promAses;
    const prom = Array.from({ length: 12 }, (_, i) => {
      if (man(promMes, i)) return Math.max(0, +promMes[i]);
      if (pa && pa.prom.length) {
        const c = reparto(otn[i], pa.W[i], pa.min ? pa.min[i] : null); const n = sum(c);
        return n > 0 ? sum(c.map((x, j) => x * pa.prom[j])) / n : sum(pa.prom) / pa.prom.length;
      }
      return promBase;
    });
    const sR = Array.isArray(sRec) && sRec.length === 12 ? sRec : Array(12).fill(1);
    const P = {}; const K = ['tasaRec','promo','ases','comi','solic','planif','otn','orn','sun','canc','vgn','otm','orm','sum','saldo','c1','c15','c30','moran','pc1','pc15','pc30','mmin','mmax','prom','demn','dem','castn','cast','recup','recdem','reccast'];
    K.forEach(k => P[k] = Array(13).fill(0));
    P.saldo[0] = S0; P.vgn[0] = V0;
    const pc0 = { c1: S0 > 0 ? s.c1[12] / S0 : 0, c15: S0 > 0 ? s.c15[12] / S0 : 0, c30: S0 > 0 ? s.c30[12] / S0 : 0 };
    P.pc1[0] = pc0.c1; P.pc15[0] = pc0.c15; P.pc30[0] = pc0.c30;
    P.c1[0] = s.c1[12]; P.c15[0] = s.c15[12]; P.c30[0] = s.c30[12];
    const moraRatio0 = V0 > 0 ? s.c1n[12] / V0 : 0; P.moran[0] = s.c1n[12];
    const cats = Object.keys(mix || {});
    P.cat = {}; ['ORI', ...cats].forEach(c => P.cat[c] = Array(13).fill(0));
    for (let m = 1; m <= 12; m++) {
      const Sp = P.saldo[m - 1], Vp = P.vgn[m - 1];
      P.otn[m] = otn[m - 1];
      P.otm[m] = r2(P.otn[m] * prom[m - 1]);
      P.orn[m] = Math.min(P.otn[m], Math.round(P.otn[m] * p.pOrig));
      P.sun[m] = P.otn[m] - P.orn[m];
      P.orm[m] = Math.min(P.otm[m], r2(P.orn[m] * prom[m - 1] * p.kOrig));
      P.sum[m] = r2(P.otm[m] - P.orm[m]);
      P.tasaRec[m] = p.recRate * sR[m - 1] * (Array.isArray(p.recFact) ? p.recFact[m - 1] : 1);
      P.recup[m] = r2(Sp * P.tasaRec[m]);
      P.cast[m] = r2(Sp * p.castRate * (Array.isArray(p.castFact) ? p.castFact[m - 1] : 1));
      P.saldo[m] = r2(Sp + P.otm[m] - P.recup[m] - P.cast[m]);
      P.castn[m] = Math.round(Vp * p.castnRate);
      P.canc[m] = Math.round(Vp * p.closeRate);
      P.vgn[m] = Vp + P.otn[m] - P.canc[m] - P.castn[m];
      P.dem[m] = r2(Sp * p.demRate); P.demn[m] = Math.round(Vp * p.demnRate);
      P.pc1[m] = P.pc1[m - 1] * (1 - p.redC1);
      P.pc15[m] = P.pc15[m - 1] * (1 - p.redC15);
      P.pc30[m] = P.pc30[m - 1] * (1 - p.redC30);
      P.c1[m] = r2(P.saldo[m] * P.pc1[m]); P.c15[m] = r2(P.saldo[m] * P.pc15[m]); P.c30[m] = r2(P.saldo[m] * P.pc30[m]);
      P.moran[m] = Math.round(P.vgn[m] * moraRatio0 * (pc0.c1 > 0 ? P.pc1[m] / pc0.c1 : 1));
      P.promo[m] = Math.round(p.promoAsesor * p.nAsesores);
      P.ases[m] = Math.round(P.promo[m] * p.fAsesoria);
      P.planif[m] = Math.round(P.otn[m] * p.fPlanif);
      P.solic[m] = Math.round(P.planif[m] * p.fSolic);
      P.comi[m] = Math.round(P.solic[m] * p.fComite);
      P.mmin[m] = p.montoMin; P.mmax[m] = p.montoMax; P.prom[m] = P.otn[m] > 0 ? r2(P.otm[m] / P.otn[m]) : 0;
      P.recdem[m] = r2(Sp * p.recDemRate); P.reccast[m] = r2(Sp * p.recCastRate);
      P.cat.ORI[m] = P.orm[m];
      const parts = cents(P.sum[m], cats.map(c => mix[c]));
      cats.forEach((c, i) => P.cat[c][m] = parts[i]);
    }
    return P;
  }

  /* --------- 4. DISTRIBUCIÓN A ASESORES --------- */
  /* ases: [{id, saldo, vig, cer1, cm, peso?}] ; diasEf[i][m-1] días efectivos ; diasMes[m-1] */
  /* Peso base de cada asesor según el criterio (o el peso manual). */
  function basePesos(ases, criterio) {
    const n = ases.length;
    const tS = sum(ases.map(a => a.saldo)), tC = sum(ases.map(a => a.cm));
    return ases.map(a => {
      if (a.peso != null && a.peso !== '' && isFinite(a.peso)) return Math.max(0, +a.peso);
      const ps = tS > 0 ? a.saldo / tS : 1 / n, pc = tC > 0 ? a.cm / tC : 1 / n;
      if (criterio === 'categoria') return a.cpd > 0 ? a.cpd : 1;
      return criterio === 'igual' ? 1 / n : criterio === 'colocacion' ? pc : criterio === 'mixto' ? 0.5 * ps + 0.5 * pc : ps;
    });
  }
  /* Pesos mensuales de créditos por asesor: peso base × días efectivos / días del mes. */
  function pesosMensuales(base, diasEf, diasMes) {
    return Array.from({ length: 12 }, (_, m) => base.map((b, i) => b * (diasMes[m] > 0 ? diasEf[i][m] / diasMes[m] : 0)));
  }
  /* Punto de partida de cada asesor (dic-2026): dato real cargado (a.real) o, si falta, el Tipo de Cartera. */
  function inicioAsesor(a) {
    const r = a.real || {};
    const saldo = r.saldo != null ? r.saldo : a.saldo, vig = r.vgn != null ? r.vgn : a.vig, c1 = r.c1 != null ? r.c1 : a.cer1;
    const c15 = r.c15 != null ? r.c15 : null, c30 = r.c30 != null ? r.c30 : null, c1n = r.c1n != null ? r.c1n : null;
    return { saldo, vig, c1, c15, c30, c1n };
  }
  function distribuir(P, ases, diasEf, diasMes, criterio) {
    const base = basePesos(ases, criterio);
    const W = pesosMensuales(base, diasEf, diasMes);
    const ini = ases.map(inicioAsesor);
    const tS = sum(ini.map(x => x.saldo));
    const relDe = k => { // riesgo relativo de cada asesor en c1/c15/c30
      const vals = ini.map(x => (x[k] != null ? x[k] : x.c1));
      const agR = tS > 0 ? sum(vals) / tS : 0;
      return ini.map((x, i) => (agR > 0 && x.saldo > 0 ? (vals[i] / x.saldo) / agR : 1));
    };
    const rel = { c1: relDe('c1'), c15: relDe('c15'), c30: relDe('c30') };
    const R = ases.map(() => { const o = {}; Object.keys(P).forEach(k => { if (k !== 'cat' && Array.isArray(P[k])) o[k] = Array(13).fill(0); }); o.cat = {}; Object.keys(P.cat).forEach(c => o.cat[c] = Array(13).fill(0)); return o; });
    const s0 = cents(P.saldo[0], ini.map(x => x.saldo));
    const v0 = lr(P.vgn[0], ini.map(x => x.vig));
    R.forEach((r, i) => { r.saldo[0] = s0[i]; r.vgn[0] = v0[i]; });
    ['c1', 'c15', 'c30'].forEach(k => { const c = cents(P[k][0], R.map((r, i) => Math.max(0, r.saldo[0]) * rel[k][i])); R.forEach((r, i) => r[k][0] = c[i]); });
    R.forEach(r => { r.pc1[0] = r.saldo[0] > 0 ? r.c1[0] / r.saldo[0] : 0; r.pc15[0] = r.saldo[0] > 0 ? r.c15[0] / r.saldo[0] : 0; r.pc30[0] = r.saldo[0] > 0 ? r.c30[0] / r.saldo[0] : 0; });
    const todosN = ini.every(x => x.c1n != null);
    const mn0 = lr(P.moran[0], ini.map((x, i) => (todosN ? x.c1n : R[i].c1[0])));
    R.forEach((r, i) => r.moran[0] = mn0[i]);
    const set = (k, m, arr) => arr.forEach((v, i) => R[i][k][m] = v);
    for (let m = 1; m <= 12; m++) {
      const w = W[m - 1];
      const sp = R.map(r => r.saldo[m - 1]), vp = R.map(r => r.vgn[m - 1]);
      set('otn', m, reparto(P.otn[m], w, ases.some(a => a.minMes) ? ases.map(a => (a.minMes ? a.minMes[m - 1] : 0)) : null));
      const kc = ases.map(a => (a.kc > 0 ? a.kc : 1));
      const wm = R.map((r, i) => r.otn[m] * kc[i]);
      set('otm', m, cents(P.otm[m], sum(wm) > 0 ? wm : w));
      set('orn', m, lr(P.orn[m], R.map(r => r.otn[m])));
      const wo = R.map((r, i) => r.orn[m] * kc[i]);
      set('orm', m, cents(P.orm[m], sum(wo) > 0 ? wo : R.map(r => r.orn[m])));

  const t = [['mercado','Mercado'],['resumen','Presidencia'],['agencia','Agencia'],['asesores','Asesores'],['datos','Datos']];
  if (S.me.admin) t.push(['usuarios','Usuarios']);
  t.push(['metodo','Metodología']);
  return t;
}
function renderTabs() {
  if (S.fb && (!S.authed || S.me.cambiar || S.sinAcceso)) { $('#tabs').innerHTML = ''; return; }
  const T = tabsDef();
  if (!T.some(t => t[0] === S.view)) S.view = 'mercado';
  $('#tabs').innerHTML = T.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.view === k}">${l}</button>`).join('');
}
function renderWho() {
  const r = S.me.rol ? ROLES[S.me.rol] : (S.me.admin ? 'Administración' : 'Sin rol asignado');
  const sc = S.me.scope || {};
  const alc = S.me.rol === 'REG' ? `Región ${sc.reg}` : S.me.rol === 'ZON' ? sc.zona : S.me.rol === 'AGE' ? (S.ag[sc.ag] || {}).nombre || sc.ag : (S.me.rol || S.me.admin) ? 'Toda la institución' : '';
  if (S.fb && !S.authed) { $('#who').innerHTML = ''; return; }
  $('#who').innerHTML = (S.fb ? `<span class="chip">${esc(S.me.nombre || S.me.email || '')}</span>` : '') + `<span class="chip">${esc(r)}</span>${alc ? `<span class="chip">${esc(alc)}</span>` : ''}${S.readonly ? '<span class="chip">Solo lectura</span>' : ''}${S.fb ? '<button class="btn lnk" data-logout="1">Salir</button>' : ''}`;
}
let renderQueued = false;
function render() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; doRender(); }); }
function doRender() {
  renderTabs(); renderWho();
  const m = $('#main');
  const keep = document.activeElement && document.activeElement.id ? {id: document.activeElement.id, s: document.activeElement.selectionStart} : null;
  if (S.fb) {
    if (!S.authed) { m.innerHTML = vistaLogin(); return; }
    if (S.sinAcceso && !S.me.boot) { m.innerHTML = `<section class="card login"><h2>Sin acceso</h2><p>Tu usuario (${esc(S.me.email)}) todavía no tiene un cargo asignado en PLANIFICA 2027. Pide a la administración que te habilite.</p><button class="btn" data-logout="1">Salir</button></section>`; return; }
    if (S.loaded.usr && S.me.cambiar) { m.innerHTML = vistaClave(); return; }
  }
  if (!S.db) { m.innerHTML = `<section class="card"><div class="empty">La base compartida no está disponible en esta vista. Abre la planificación desde claude.ai con tu cuenta institucional.</div></section>`; return; }
  if (!S.loaded.ag || !S.loaded.usr) { m.innerHTML = `<section class="card"><div class="empty">Cargando agencias y usuarios…</div></section>`; return; }
  if (!S.me.admin && !S.me.rol) { m.innerHTML = vistaSolicitud(); return; }
  if (!Object.keys(S.ag).length) { m.innerHTML = `<section class="card"><div class="empty">Todavía no hay datos cargados. ${S.me.admin ? 'Sube los archivos de Cumplimiento Mensual y de Tipo de Cartera en la pestaña Datos.' : 'La administración debe cargar los archivos de Cumplimiento Mensual y Tipo de Cartera.'}</div></section>` + (S.view === 'datos' ? vistaDatos() : ''); return; }
  const vis = visibles();
  if (!S.sel || !S.ag[S.sel] || !vis.some(v => v[0] === S.sel)) S.sel = vis.length ? vis[0][0] : null;
  const V = {mercado: vistaMercado, resumen: vistaResumen, agencia: vistaAgencia, asesores: vistaAsesores, datos: vistaDatos, usuarios: vistaUsuarios, metodo: vistaMetodo}[S.view] || vistaResumen;
  m.innerHTML = V();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
  if (S.view === 'usuarios') resolverNombres();
}

/* Cantón de cada agencia (la base de la SB/SEPS llega hasta cantón; Malacatos se compara con el cantón Loja y Amaguaña, Quinche y Tumbaco con Quito). */
const AG_CANT = {'amaguana': 'QUITO', 'quinche': 'QUITO', 'tumbaco': 'QUITO', 'cayambe': 'CAYAMBE', 'san-miguel': 'SAN MIGUEL DE LOS BANCOS',
  'cariamanga': 'CALVAS', 'catacocha': 'PALTAS', 'catamayo': 'CATAMAYO', 'celica': 'CELICA', 'centro': 'LOJA', 'las-pitas': 'LOJA', 'norte': 'LOJA', 'malacatos': 'LOJA',
  'palanda': 'PALANDA', 'zamora': 'ZAMORA', 'zumba': 'CHINCHIPE', 'pasaje': 'PASAJE', 'pinas': 'PIÑAS', 'santa-rosa': 'SANTA ROSA',
  'la-troncal': 'LA TRONCAL', 'milagro': 'MILAGRO', 'naranjal': 'NARANJAL', 'el-carmen': 'EL CARMEN', 'flavio-alfaro': 'FLAVIO ALFARO', 'quininde': 'QUININDE', 'santo-domingo': 'SANTO DOMINGO'};
const SEG_N = {'BANCA PRIVADA': 'Banca privada', 'BANCA PUBLICA': 'Banca pública', 'S1': 'Cooperativas segmento 1', 'S2': 'Cooperativas segmento 2', 'S3': 'Cooperativas segmento 3', 'MUT': 'Mutualistas'};
const SEG_C = {'BANCA PRIVADA': 'Banco privado', 'BANCA PUBLICA': 'Banco público', 'S1': 'Coop. S1', 'S2': 'Coop. S2', 'S3': 'Coop. S3', 'MUT': 'Mutualista'};
/* FACES por agencia: saldo y CER > 30 a dic-24, dic-25, ago-26 (mismo corte que el mercado) y dic-26 */
function facesAg(k) {
  const q = prep(k); if (!q) return null;
  const y = E.serie(S.ag[k].hist, '2025'), F = q.F.s, iA = Math.min(8, q.F.last);
  return {s24: y ? y.saldo[0] : 0, s25: y ? y.saldo[12] : F.saldo[0], sA: F.saldo[iA], s26: F.saldo[12],
    r24: y ? y.c30[0] : 0, r25: y ? y.c30[12] : F.c30[0], rA: F.c30[iA], r26: F.c30[12], iA};
}
function mercadoAlcance(MK, keys) {
  const cants = [...new Set(keys.map(k => AG_CANT[k]).filter(c => MK.cant[c]))];
  const nf = MK.fechas.length, iD = f => MK.fechas.indexOf(f);
  const tot = MK.fechas.map(() => ({c: 0, r: 0})), seg = {};
  MK.segs.forEach(sg => seg[sg] = MK.fechas.map(() => ({c: 0, r: 0})));
  cants.forEach(c => MK.segs.forEach(sg => (MK.cant[c][sg] || []).forEach((v, i) => { tot[i].c += v[0]; tot[i].r += v[1]; seg[sg][i].c += v[0]; seg[sg][i].r += v[1]; })));
  const ents = {};
  MK.er.forEach(r => { if (!cants.includes(r[0])) return; const x = ents[r[1]] || (ents[r[1]] = {i: r[1], n: MK.ents[r[1]][0], sg: MK.ents[r[1]][1], c24: 0, c25: 0, c26: 0, r25: 0, r26: 0});
    x.c24 += r[2]; x.c25 += r[3]; x.c26 += r[4]; x.r25 += r[5]; x.r26 += r[6]; });
  const fa = {s24: 0, s25: 0, sA: 0, s26: 0, r24: 0, r25: 0, rA: 0, r26: 0};
  keys.forEach(k => { const f = facesAg(k); if (f) Object.keys(fa).forEach(x => fa[x] += f[x]); });
  return {cants, tot, seg, ents: Object.values(ents).sort((a, b) => b.c26 - a.c26), fa, iD, nf};
}
function svgSerie(pts, opt) {
  /* columnas REAL con etiqueta de valor y variación anual */
  const W = 760, H = 230, pl = 10, pb = 34, pt = 30;
  const max = Math.max(...pts.map(p => p.v)) * 1.08;
  const step = (W - 2 * pl) / pts.length, bw = step * 0.56;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.titulo)}">`;
  pts.forEach((p, i) => {
    const x = pl + i * step + (step - bw) / 2;
    g += `<rect class="${p.t === 'P' ? 'pron' : (opt.cls || 'real')}" x="${x.toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pb - y(p.v)).toFixed(1)}"></rect>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y(p.v) - 16).toFixed(1)}" text-anchor="middle" class="val">${opt.fmt(p.v)}</text>`;
    if (p.d != null) g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y(p.v) - 4).toFixed(1)}" text-anchor="middle" class="${p.d >= 0 ? 'vpos' : 'vneg'}">${p.d >= 0 ? '+' : ''}${fmtN(p.d * 100, 1)} %</text>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - pb + 14}" text-anchor="middle">${esc(p.l)}</text>`;
  });
  g += `<line class="base" x1="${pl}" x2="${W - pl}" y1="${H - pb}" y2="${H - pb}"></line></svg>`;
  return `<div class="scroll">${g}</div>`;
}
function svgLineas(series, labels, opt) {
  const W = 760, H = 240, pl = 44, pr = 130, pb = 30, pt = 14;
  const all = series.flatMap(s => s.v.filter(v => v != null));
  const max = Math.max(...all) * 1.15, min = 0;
  const x = i => pl + (W - pl - pr) * i / (labels.length - 1), y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.titulo)}">`;
  for (let t = 0; t <= max; t += opt.paso) g += `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"></line><text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end">${fmtN(t * 100, 0)} %</text>`;
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(s => {
    const pts = s.v.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    g += `<polyline class="${s.cls}" fill="none" points="${pts.map(p => p.join(',')).join(' ')}"></polyline>`;
    s.v.forEach((v, i) => { if (v != null) g += `<circle class="${s.cls}-pt" cx="${x(i)}" cy="${y(v)}" r="3.2"></circle>`; });
    const lastI = s.v.map((v, i) => v != null ? i : -1).filter(i => i >= 0).pop();
    g += `<text x="${x(lastI) + 8}" y="${y(s.v[lastI]) + 4}" class="lbl">${esc(s.n)} ${fmtN(s.v[lastI] * 100, 1)} %</text>`;
  });
  g += `</svg>`;
  return `<div class="scroll">${g}</div>`;
}

    <div class="kpi k2"><div class="l">Crecimiento del mercado 2025</div><div class="v">${g25 == null ? '—' : fmtN(g25 * 100, 1) + ' %'}</div><div class="c">2026 ene–ago: ${sgn(gA)} · FACES 2025: ${sgn(fg25)} · 2026 ene–ago: ${sgn(fgA)}</div></div>
    <div class="kpi k3"><div class="l">Mora del mercado · ${corteL}</div><div class="v">${fmtN(mr(iA) * 100, 2)} %</div><div class="c">FACES CER > 30: ${fa.sA ? fmtP(fa.rA / fa.sA) : '—'} · dic-2025 mercado ${fmtP(mr(i25))}</div></div>

const FILE_ALIAS = {'FALVIO ALFARO': 'FLAVIO ALFARO', 'SAN MIGUEL DE LOS BANCOS': 'SAN MIGUEL', 'OFICINA CENTRO': 'CENTRO', 'OFICINA LAS PITAS': 'LAS PITAS', 'OFICINA NORTE': 'NORTE'};

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
function leerCumplimiento(wb, fname) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const cell = a => (ws[a] || {}).v;
  if (!/CUMPLIMIENTO MENSUAL/i.test(String(cell('A3') || ''))) return null;
  let corte = cell('J4'); if (typeof corte === 'number') corte = XLSX.SSF.parse_date_code(corte); else if (corte instanceof Date) corte = {y: corte.getFullYear(), m: corte.getMonth() + 1}; else { const d = new Date(corte); corte = {y: d.getFullYear(), m: d.getMonth() + 1}; }
  const year = +cell('C7') || corte.y;
  const m = String(fname).match(/Ejecutado\s*\d{4}\s*(.+?)(?:\s*xlsx)?\.xlsx?$/i);
  let ag = m ? norm(m[1]) : ''; ag = FILE_ALIAS[ag] || ag;
  const out = {_m: corte.y > year ? 12 : corte.m};
  const range = XLSX.utils.decode_range(ws['!ref']);
  const nk = Object.keys(CUMPL_ROWS).map(x => [norm(x), CUMPL_ROWS[x]]);
  for (let r = range.s.r; r <= range.e.r; r++) {
    const lab = norm((ws[XLSX.utils.encode_cell({r, c: 0})] || {}).v); if (!lab) continue;
    const hit = nk.find(([x]) => lab.startsWith(x)); if (!hit || out[hit[1]]) continue;
    out[hit[1]] = Array.from({length: 13}, (_, i) => Math.round((+((ws[XLSX.utils.encode_cell({r, c: i + 1})] || {}).v) || 0) * 100) / 100);
  }
  const falt = Object.values(CUMPL_ROWS).filter(k => !out[k]);
  if (/ASESOR/i.test(String(cell('B5') || ''))) return {tipo: 'cumplAse', nombre: String(cell('B4') || '').replace(/\s+/g, ' ').trim(), year: String(year), data: out, falt};
  return {tipo: 'cumpl', ag, year: String(year), data: out, jefe: cell('B4') || '', falt};
}
function leerTipoCartera(wb, fname) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true});
  const hi = rows.findIndex(r => r && norm(r[0]) === 'REGION' && norm(r[4]).startsWith('SALDO CARTERA'));
  if (hi < 0) return null;
  const A = [];
  rows.slice(hi + 1).forEach(r => {
    if (!r || !r[0] || typeof r[4] !== 'number') return;
    let ag = norm(r[2]); ag = FILE_ALIAS[ag] || ag; if (ag === 'MATRIZ') return;
    const n = String(r[3]).replace(/\s+/g, ' ').trim();
    const cat = {}; ['EXC','INA','RET','LIQ','ORI','COV'].forEach((c, i) => cat[c] = [+r[11 + 3 * i] || 0, Math.round((+r[12 + 3 * i] || 0) * 100) / 100]);
    A.push({ag, reg: norm(r[0]), zona: String(r[1]).replace(/\s+/g, ' ').trim(), id: slug(n), n, saldo: +r[4] || 0, vig: +r[5] || 0, cer1: +r[6] || 0, pn: +r[8] || 0, cn: +r[9] || 0, pm: +r[29] || 0, cm: +r[30] || 0, cat});
  });
  const fm = String(fname || '').match(/(20\d{2})[_-](\d{2})[_-](\d{2})/);

function fechaCelda(v) {

  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null;

const addDias = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function leerVacaciones(wb) {
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, raw: true});
    for (let h = 0; h < Math.min(20, rows.length); h++) {
      const H = (rows[h] || []).map(norm);
      const cn = H.findIndex(x => /NOMBRE|COLABORADOR|APELLIDO|ASESOR|EMPLEADO|FUNCIONARIO/.test(x));
      const desde = H.map((x, i) => /DESDE|INICIO|SALIDA/.test(x) ? i : -1).filter(i => i >= 0);
      if (cn < 0 || !desde.length) continue;
      const pares = desde.map(i => { let j = H.findIndex((x, jj) => jj > i && /HASTA|FIN|RETORNO|REINTEGRO|REGRESO/.test(x)); const dj = H.findIndex((x, jj) => jj > i && /^DIAS|DIAS /.test(x)); return {i, j, ret: j >= 0 && /RETORNO|REINTEGRO|REGRESO/.test(H[j]), dj}; });
      const filas = [];
      rows.slice(h + 1).forEach(r => {
        if (!r || !r[cn]) return;
        const n = String(r[cn]).replace(/\s+/g, ' ').trim();
        const per = [];
        pares.forEach(p => {
          const d = fechaCelda(r[p.i]); if (!d) return;
          let hh = p.j >= 0 ? fechaCelda(r[p.j]) : null;
          if (hh && p.ret) hh = addDias(hh, -1);
          if (!hh && p.dj >= 0 && +r[p.dj] > 0) hh = addDias(d, Math.round(+r[p.dj]) - 1);
          if (hh && hh >= d) per.push({d, h: hh});
        });
        if (per.length) filas.push({n, per});
      });
      if (filas.length) return {tipo: 'vac', hoja: sn, filas};
    }
  }
  return null;
}
function buscarAsesor(nombre) {
  const t = norm(nombre).split(' ').filter(x => x.length > 1);
  const cands = [];
  Object.entries(S.ag).forEach(([k, a]) => (a.asesores || []).forEach(x => {
    const u = norm(x.n).split(' ').filter(z => z.length > 1);
    const [cor, lar] = t.length <= u.length ? [t, u] : [u, t];
    if (cor.length >= 2 && cor.every(z => lar.includes(z))) cands.push({k, id: x.id, n: x.n, exacto: t.join(' ') === u.join(' ')});
  }));
  const ex = cands.filter(c => c.exacto);
  return ex.length === 1 ? ex[0] : cands.length === 1 ? cands[0] : null;
}

async function procesarArchivos(files, corteTC) {
  const res = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {type: 'array', cellDates: false});
      const x = leerCumplimiento(wb, f.name) || leerTipoCartera(wb, f.name) || leerVacaciones(wb);
      if (!x) { res.push({f: f.name, err: 'No se reconoce el formato.'}); continue; }
      x.f = f.name; res.push(x);
    } catch (e) { res.push({f: f.name, err: 'No se pudo leer el archivo.'}); }
  }
  // validaciones
  const cumpl = res.filter(r => r.tipo === 'cumpl');
  cumpl.forEach(r => {
    r.obs = [];
    if (!S.ag[slug(r.ag)] && !res.some(t => t.tipo === 'tc' && t.ases.some(a => a.ag === r.ag))) r.obs.push('Agencia nueva: se crea con este nombre.');
    let bad = 0; const d = r.data;
    for (let m = 1; m <= d._m; m++) { const c = d.saldo[m - 1] + d.otm[m] - d.cuo[m] - d.prr[m] - d.prt[m] - d.cam[m]; if (Math.abs(c - d.saldo[m]) > 0.05) bad++; }
    if (bad) r.obs.push(`${bad} meses no cuadran el saldo.`);
    if (r.falt.length) r.obs.push(`Faltan filas: ${r.falt.join(', ')}`);
    // duplicado contra otras agencias
    const firma = JSON.stringify(d.saldo.slice(1, d._m + 1));
    cumpl.forEach(o => { if (o !== r && o.year === r.year && JSON.stringify(o.data.saldo.slice(1, o.data._m + 1)) === firma) r.obs.push(`Mismos datos que ${o.ag}.`); });
    Object.entries(S.ag).forEach(([k, a]) => { const y = a.hist && a.hist.y && a.hist.y[r.year]; if (k !== slug(r.ag) && y && JSON.stringify(y.saldo.slice(1, y._m + 1)) === firma) r.obs.push(`Mismos datos ya cargados de ${a.nombre}.`); });
    const prev = S.ag[slug(r.ag)] && S.ag[slug(r.ag)].hist.y[String(+r.year - 1)];
    if (prev && prev._m === 12 && Math.abs(prev.saldo[12] - d.saldo[0]) > 1) r.obs.push(`El saldo de arranque no coincide con el cierre ${+r.year - 1} cargado.`);
    r.dup = r.obs.some(o => o.startsWith('Mismos datos'));
  });
  res.filter(r => r.tipo === 'cumplAse').forEach(r => {
    r.match = buscarAsesor(r.nombre);
    const m = r.data._m;
    r.obs = [r.match ? `${r.match.n} (${S.ag[r.match.k].nombre}) · cierre ${MESL[m - 1]} ${r.year}: saldo ${fmtN(r.data.saldo[m])}, vigentes ${fmtN(r.data.vgn[m])}` : 'No coincide con ningún asesor cargado.'];
  });
  res.filter(r => r.tipo === 'vac').forEach(r => {
    r.filas.forEach(f => f.match = buscarAsesor(f.n));
    const sin = r.filas.filter(f => !f.match);
    const per27 = r.filas.reduce((a, f) => a + f.per.filter(p => p.h >= '2027-01-01' && p.d <= '2027-12-31').length, 0);
    r.obs = [`${r.filas.length - sin.length} de ${r.filas.length} colaboradores coinciden con asesores; ${per27} períodos en 2027.`];
    if (sin.length) r.obs.push(`Sin coincidencia (no son asesores o el nombre difiere): ${sin.slice(0, 12).map(f => f.n).join('; ')}${sin.length > 12 ? '…' : ''}`);
  });
  const html = `<h3>Archivos leídos</h3><div class="scroll"><table><thead><tr><th>Archivo</th><th class="l">Tipo</th><th class="l">Agencia / contenido</th><th class="l">Corte</th><th class="l">Observaciones</th></tr></thead><tbody>
    ${res.map(r => `<tr><td class="small">${esc(r.f)}</td><td class="l">${r.err ? '' : r.tipo === 'tc' ? 'Tipo de Cartera' : r.tipo === 'vac' ? 'Vacaciones' : r.tipo === 'cumplAse' ? 'Cumplimiento por asesor' : 'Cumplimiento'}</td><td class="l">${r.err ? '' : r.tipo === 'tc' ? `${r.ases.length} asesores · ${new Set(r.ases.map(a => a.ag)).size} agencias` : r.tipo === 'vac' ? `Hoja ${esc(r.hoja)} · ${r.filas.length} colaboradores` : r.tipo === 'cumplAse' ? esc(r.nombre) + ' ' + r.year : esc(r.ag) + ' ' + r.year}</td>
      <td class="l">${r.tipo === 'cumpl' || r.tipo === 'cumplAse' ? MESL[r.data._m - 1] : r.tipo === 'tc' ? `<input id="corteTC" type="date" value="${esc(r.corte || corteTC || '')}">` : ''}</td><td class="l small wrap">${r.err ? `<span class="flag">${esc(r.err)}</span>` : (r.obs || []).map(o => `<span class="${/Mismos|no cuadran|Faltan|no coincide/.test(o) ? 'flag' : ''}">${esc(o)}</span>`).join(' ')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="bar" style="margin-top:8px"><button class="btn pri" data-upsave="1">Guardar en la base</button><button class="btn" data-upcancel="1">Descartar</button>
    <span class="muted small">Los archivos marcados con "Mismos datos" no se guardan.</span></div>`;
  upPrev = {res, html};
}
async function guardarArchivos() {
  if (!upPrev) return;
  const res = upPrev.res; const corte = ($('#corteTC') || {}).value || null;
  const nuevo = {};
  const get = k => nuevo[k] || (nuevo[k] = JSON.parse(JSON.stringify(S.ag[k] || {nombre: '', reg: '', zona: '', jefe: '', hist: {y: {}}, tc: {}, asesores: [], alertas: []})));
  res.filter(r => r.tipo === 'tc').forEach(r => {
    const by = {}; r.ases.forEach(a => (by[a.ag] = by[a.ag] || []).push(a));
    Object.entries(by).forEach(([ag, L]) => {
      const d = get(slug(ag)); d.nombre = d.nombre || ag; d.reg = L[0].reg; d.zona = L[0].zona;
      d.asesores = L.map(a => ({id: a.id, n: a.n, saldo: a.saldo, vig: a.vig, cer1: a.cer1, cn: a.cn, cm: a.cm, pn: a.pn, pm: a.pm, cat: a.cat}));
      const cat = {}; ['EXC','INA','RET','LIQ','ORI','COV'].forEach(c => cat[c] = [E.sum(L.map(a => a.cat[c][0])), E.r2(E.sum(L.map(a => a.cat[c][1])))]);
      d.tc = {corte: corte || '', ase: L.length, saldo: E.r2(E.sum(L.map(a => a.saldo))), cn: E.sum(L.map(a => a.cn)), cm: E.r2(E.sum(L.map(a => a.cm))), pn: E.sum(L.map(a => a.pn)), pm: E.r2(E.sum(L.map(a => a.pm))), cat};
    });
  });
  res.filter(r => r.tipo === 'cumpl' && !r.dup).forEach(r => {
    const d = get(slug(r.ag)); d.nombre = d.nombre || r.ag;
    d.hist = d.hist || {y: {}}; d.hist.y = d.hist.y || {}; d.hist.y[r.year] = r.data;
    if (+r.year >= 2026 && r.jefe) d.jefe = r.jefe;
    d.alertas = (d.alertas || []).filter(t => !t.includes(`Cumplimiento ${r.year}`));
  });
  res.filter(r => r.tipo === 'cumplAse' && r.match).forEach(r => {
    const d = get(r.match.k), m = r.data._m, x = (d.asesores || []).find(z => z.id === r.match.id); if (!x) return;
    x.real = {y: +r.year, m, saldo: r.data.saldo[m], vgn: r.data.vgn[m], c1: r.data.c1[m], c15: r.data.c15[m], c30: r.data.c30[m], c1n: r.data.c1n[m]};
  });
  let okv = 0; for (const r of res.filter(r => r.tipo === 'vac')) okv += await guardarVacExcel(r);
  let ok = 0;
  for (const [k, d] of Object.entries(nuevo)) {
    if (!d.reg) { toast(`${d.nombre}: falta el Tipo de Cartera para conocer su región y asesores.`); }
    try { await S.db.collection('agencias').doc(k).set(d); ok++; } catch (e) { toast(`No se pudo guardar ${d.nombre}: ${e.message || e.code}`); }
  }
  upPrev = null; toast(`Datos guardados: ${ok} agencias actualizadas${okv ? `, vacaciones en ${okv} agencias` : ''}.`); render();
}

/* ---------------- METODOLOGÍA ---------------- */
function vistaMetodo() {
  return `<section class="card prose"><h2>Cómo se calcula</h2>
  <h3>Fuentes</h3><ul><li>Cumplimiento Mensual Ejecutado 2025 y 2026 por agencia (saldo, colocación, recuperación, castigos, vigentes, originales, CER, demandados).</li><li>Consolidado Tipo de Cartera por asesor (saldo, vigentes, colocado del mes por tipo de cartera).</li><li>Normativa: MPOL Otorgamiento de Microcréditos v4.2 (6.2.6 y Anexo 5) y POL Plan de Carrera de Asesores de Crédito v1.0 (Tablas 1, 1.1 y 2).</li></ul>
  <h3>Pronóstico 2026</h3><p>Para cada mes sin dato real: colocación = promedio mensual 2026 de la agencia × factor estacional del mismo mes en 2025 (mitad agencia, mitad FACES). En el mes del corte de Tipo de Cartera se suma lo colocado a la fecha más el ritmo histórico de los días hábiles restantes. La recuperación (cuotas + precancelaciones, incluidas las de renovación) es una tasa sobre el saldo del mes anterior, con su estacionalidad 2025. El saldo cumple siempre: saldo anterior + colocación − cuotas − precancelaciones − castigos. Se excluyen de las tasas los meses de apertura o traspaso de cartera.</p>
  <h3>Premisas</h3><ul><li>Recuperación (amortización): tasa real 2026 de cada agencia sobre el saldo del mes anterior, con la estacionalidad de 2025.</li><li>Colocación: mínimo un crédito por día laborable por asesor. Créditos del año = créditos por día × días-asesor laborables (sin feriados nacionales y locales ni vacaciones).</li><li>Estacionalidad: los créditos del año se reparten en los meses según la estacionalidad histórica de la agencia, ajustada por los días disponibles de cada mes.</li><li>Monto promedio: por categoría de asesor, fijado por Presidencia para cada agencia. El sugerido es el promedio 2026 de la agencia × coeficiente de la categoría, redondeado.</li></ul>
<h3>Revisión de Presidencia</h3><p>Presidencia revisa agencia por agencia (región, zona, agencia), ajusta créditos por día y montos por categoría y ve los avisos: crecimientos que la agencia nunca registró, crecimientos de 100 % o más, montos muy por encima de su histórico y montos que no permiten cumplir el mínimo de colocación de la Tabla 1.1. Al aprobar los parámetros de la agencia, las jefaturas regionales, zonales y de agencia distribuyen a los asesores.</p>
<h3>Plan 2027 por agencia</h3><p>Colocación = créditos × monto. Saldo = saldo anterior + colocación − recuperación − castigos. El resto del Anexo 5 se calcula igual que en el formato institucional.</p>
<h3>Distribución a asesores</h3><p>Premisa: un crédito por día laborable. Cada categoría tiene sus créditos por día laborable (Presidencia los fija junto con la meta) y un monto promedio relativo. Cada mes la meta de la agencia se reparte por créditos por día de la categoría × días laborables efectivos del asesor (días hábiles menos feriados nacionales y locales y vacaciones). Los créditos se reparten por resto mayor y los montos al centavo, de modo que la suma de asesores es exactamente la meta de la agencia. La categoría inicial sale del saldo de cartera (Tabla 1) y se puede cambiar; el ascenso se estima con el saldo y las operaciones vigentes proyectados por tres meses consecutivos (numeral 6.2.3).</p>
  <h3>Flujo de aprobación</h3><p>Jefe de Agencia envía → Jefe Zonal valida → Jefe Regional valida → Gerencia de Negocios aprueba → Presidencia Ejecutiva aprueba. Cualquier revisor puede devolver a borrador con una observación. Después del 31 de diciembre se cargan los datos reales y el plan se ajusta antes de subirlo al CORE (MPOL 6.2.6, literal d).</p>
  <h3>Notación</h3><div class="legend"><span><i class="R"></i>REAL</span><span><i class="P"></i>PRONÓSTICO</span><span><i class="L"></i>PLAN</span></div><p class="small muted">CER > 90 no se incluye porque el Cumplimiento Mensual no trae ese dato.</p></section>`;
}

function hojaAnexo(titulo, meta, P, h25, h26, nAses) {

  aoa.push(hdr);
  const r0 = aoa.length;
  ROWS.forEach(([k, l, t, mode]) => {
    const tot = totalRow(P, k, mode);
    const row = [l, h25 ? (h25[k] ?? '') : '', h26 ? (h26[k] ?? '') : '', ...P[k].slice(1).map(v => t === '%' ? v : (t === 'n' ? Math.round(v) : E.r2(v))), t === '%' ? tot : (t === 'n' ? Math.round(tot) : E.r2(tot))];
    if (nAses) row.push(t === '%' || ['mmin','mmax','prom'].includes(k) ? tot : E.r2(tot / nAses));
    aoa.push(row);
  });
  aoa.push([]);
  aoa.push(['COLOCACIÓN POR TIPO DE CARTERA (USD)', '', '', ...MESL, 'TOTAL ANUAL']);
  Object.keys(P.cat).forEach(c => aoa.push([CATS[c], '', '', ...P.cat[c].slice(1), E.r2(E.sum(P.cat[c].slice(1)))]));
  aoa.push(['Total colocación', '', '', ...P.otm.slice(1), E.r2(E.sum(P.otm.slice(1)))]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // formatos
  ROWS.forEach(([k, l, t], i) => {
    const r = r0 + i;
    for (let c = 1; c < hdr.length; c++) { const ref = XLSX.utils.encode_cell({r, c}); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = t === '%' ? '0.00%' : t === 'n' ? '#,##0' : '#,##0.00'; }
  });
  for (let r = r0 + ROWS.length + 1; r < aoa.length; r++) for (let c = 3; c < 16; c++) { const ref = XLSX.utils.encode_cell({r, c}); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '#,##0.00'; }
  ws['!cols'] = [{wch: 38}, {wch: 16}, {wch: 18}, ...MESL.map(() => ({wch: 13})), {wch: 15}, {wch: 15}];
  return ws;
}

   Cada documento se guarda como texto JSON en /c/<colección>/<id>/j para conservar listas y valores vacíos tal cual.

function fbDb(fdb) {

  const docApi = (col, id) => ({
    set: d => ref(col + '/' + id).set(enc(col, JSON.parse(JSON.stringify(d)))),
    delete: () => ref(col + '/' + id).remove(),
    onSnapshot: (cb, err) => ref(col + '/' + id).on('value', s => { const v = parse(s.val()); cb({exists: v != null, data: () => v}); }, err),

  return {
    collection: col => ({doc: id => docApi(col, id),
      onSnapshot: (cb, err) => ref(col).on('value', s => { const o = s.val() || {}; cb({docs: Object.keys(o).map(id => ({id, data: () => parse(o[id])}))}); }, err)}),
    doc: path => { const [c, i] = path.split('/'); return docApi(c, i); },
  };

  const us = Object.entries(S.usuarios).sort((a, b) => String(a[1].nombre || '').localeCompare(String(b[1].nombre || '')));
  const lista = `<section class="card"><div class="hd"><h2>Usuarios con acceso</h2><span class="muted small">${us.length} usuarios</span></div>

async function accionFB(d) {
  const A = firebase.auth();
  if (d.login) {
    const mail = ($('#lg_mail').value || '').trim(), pass = $('#lg_pass').value || '';
    S.lgMail = mail; S.lgErr = '';
    if (!mail || !pass) { S.lgErr = 'Escribe tu correo y tu clave.'; render(); return; }
    try { await A.signInWithEmailAndPassword(mail, pass); } catch (e) { S.lgErr = msgAuth(e); render(); }
    return;
  }
  if (d.olvide) {
    const mail = ($('#lg_mail').value || '').trim(); S.lgMail = mail;
    if (!mail) { S.lgErr = 'Escribe tu correo y vuelve a pulsar "Olvidé mi clave".'; render(); return; }
    try { await A.sendPasswordResetEmail(mail); S.lgErr = ''; toast('Te enviamos un correo para crear una clave nueva. Revisa también la carpeta de spam.'); } catch (e) { S.lgErr = msgAuth(e); render(); }
    return;
  }
  if (d.logout) { try { await A.signOut(); } catch (e) {} location.reload(); return; }
  if (d.cambiaclave) {
    const a = $('#cl_1').value || '', b = $('#cl_2').value || '';
    if (a.length < 8) { S.lgErr = 'La clave debe tener al menos 8 caracteres.'; render(); return; }
    if (a !== b) { S.lgErr = 'Las dos claves no coinciden.'; render(); return; }
    try { await A.currentUser.updatePassword(a); const u = Object.assign({}, S.usuarios[S.me.id] || {}, {cambiar: false}); await S.db.collection('usuarios').doc(S.me.id).set(u); S.lgErr = ''; S.me.cambiar = false; toast('Clave actualizada.'); render(); }
    catch (e) { S.lgErr = msgAuth(e); render(); }
    return;
  }
  if (d.crearusr) {
    const v = id => ($('#' + id).value || '').trim();
    const nombre = v('nu_nom'), email = v('nu_mail').toLowerCase(), clave = v('nu_pass'), rol = v('nu_rol'), reg = v('nu_reg'), zona = v('nu_zona'), ag = v('nu_ag');
    if (!nombre || !email || clave.length < 6) { toast('Completa nombre, correo y una clave inicial de al menos 6 caracteres.'); return; }
    if (rol === 'REG' && !reg || rol === 'ZON' && !zona || rol === 'AGE' && !ag) { toast('Indica la región, zona o agencia que corresponde al cargo.'); return; }
    let app2;
    try {
      app2 = firebase.apps.find(x => x.name === 'alta') || firebase.initializeApp(window.FBCFG, 'alta');
      const cred = await app2.auth().createUserWithEmailAndPassword(email, clave);
      const uid = cred.user.uid; await app2.auth().signOut();
      await S.db.collection('usuarios').doc(uid).set({nombre, email, rol, reg, zona, ag, admin: false, cambiar: true, alta: new Date().toISOString(), por: S.me.id});
      S.nuPass = null; toast(`Usuario creado. Entrégale a ${nombre} su correo y la clave inicial: ${clave}`);
    } catch (e) { toast(msgAuth(e)); }
    return;
  }
  if (d.ureset !== undefined) { if (!d.ureset) return; try { await A.sendPasswordResetEmail(d.ureset); toast('Correo de restablecimiento enviado a ' + d.ureset + '.'); } catch (e) { toast(msgAuth(e)); } return; }
}
function iniciarFirebase() {
  S.fb = true; S.dl = dlLocal; S.authed = false;
  firebase.initializeApp(window.FBCFG);
  const A = firebase.auth(), fdb = firebase.database();
  A.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  A.onAuthStateChanged(user => {
    if (!user) { S.authed = false; S.db = null; render(); return; }
    if (S.authed && S.me.id === user.uid) return;
    S.authed = true; S.me.id = user.uid; S.me.email = (user.email || '').toLowerCase();
    S.me.boot = FB_ADMIN.includes(S.me.email);
    const db = fbDb(fdb); S.db = db;
    const err = e => { S.sinAcceso = true; S.loaded.ag = S.loaded.usr = true; render(); };
    db.collection('usuarios').onSnapshot(q => {
      const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.usuarios = o; const u = o[S.me.id];
      S.me.rol = u ? u.rol || null : null; S.me.scope = u || {}; S.me.admin = !!((u && u.admin) || S.me.boot); S.me.cambiar = !!(u && u.cambiar); S.me.nombre = u ? u.nombre : '';
      Object.keys(o).forEach(i => S.names[i] = o[i].nombre || o[i].email || ''); S.loaded.usr = true; S.sinAcceso = false; render();
    }, err);
    db.collection('agencias').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.ag = o; S.loaded.ag = true; S.ver++; render(); }, err);
    db.doc('config/main').onSnapshot(d => { S.cfgRaw = d.exists ? d.data() : null; S.loaded.cfg = true; S.ver++; render(); }, err);
    db.collection('planes').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); Object.keys(S.pending).forEach(k => o[k] = S.planes[k]); S.planes = o; S.loaded.planes = true; S.ver++; render(); }, err);
    db.collection('vacaciones').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); Object.keys(S.pendVac || {}).forEach(k => o[k] = S.vac[k]); S.vac = o; S.loaded.vac = true; S.ver++; render(); }, err);
    db.doc('mercado/main').onSnapshot(d => { S.mercado = d.exists ? d.data() : null; S.ver++; render(); }, err);
    db.doc('meta/main').onSnapshot(d => { S.meta = d.exists ? d.data() : null; S.ver++; render(); }, err);
    render();
  });
}

/* ---------------- arranque ---------------- */
async function iniciar() {
  if (window.FBCFG && window.firebase) { iniciarFirebase(); render(); return; }
  render();
  const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  S.db = db; S.user = user; S.dl = dl;
  if (user) {
    const [me, admin, owner, cw] = await Promise.all([user.me(), user.canEdit(), user.isOwner(), user.can('data.write')]);
    S.me.id = me.id; S.me.admin = !!(admin || owner); S.me.owner = !!owner; if (cw === false) S.readonly = true;
  }
  if (!db) { render(); return; }
  const err = e => { if (e && e.code === 'revoked') { S.db = null; render(); } };
  db.collection('agencias').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.ag = o; S.loaded.ag = true; S.ver++; render(); }, err);
  db.doc('config/main').onSnapshot(d => { S.cfgRaw = d.exists ? d.data() : null; S.loaded.cfg = true; S.ver++; render(); }, err);
  db.collection('planes').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); Object.keys(S.pending).forEach(k => o[k] = S.planes[k]); S.planes = o; S.loaded.planes = true; S.ver++; render(); }, err);
  db.collection('vacaciones').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); Object.keys(S.pendVac || {}).forEach(k => o[k] = S.vac[k]); S.vac = o; S.loaded.vac = true; S.ver++; render(); }, err);
  db.doc('mercado/main').onSnapshot(d => { S.mercado = d.exists ? d.data() : null; render(); }, err);
  db.doc('meta/main').onSnapshot(d => { S.meta = d.exists ? d.data() : null; S.ver++; render(); }, err);
  db.collection('usuarios').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.usuarios = o; const u = o[S.me.id]; S.me.rol = u ? u.rol : null; S.me.scope = u || {}; S.loaded.usr = true; render(); }, err);
  db.collection('solicitudes').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.solic = o; render(); }, err);
}
iniciar();
})();
